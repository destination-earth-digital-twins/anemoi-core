defaults:
- data: zarr
- dataloader: multi_domain
- datamodule: single
- diagnostics: evaluation
- hardware: slurm
- graph: multi_domain_stretched
- model: graphtransformer_multi_domain
- training: multi_domain_stretched
- _self_
#- override hydra/hydra_logging: disabled
- override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

config_validation: False

diagnostics:
  defaults:
  - plot: simple
  - callbacks: placeholder
  - benchmark_profiler: simple
  log:
    mlflow:
      enabled: True
      offline: True
      authentication: True
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: 'multi-domain-experiments'
      run_name: debug-aa-meps-refactor
      system: True
      max_params_length: 6000
    interval: 10 #100
    wandb:
      entity: null
  plot:
    callbacks: []
  checkpoint:
    every_n_minutes:
      save_frequency: 30
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 1
      num_models_saved: -1


data:
  resolution: None
  forcing:
  - "cos_latitude"
  - "cos_longitude"
  - "sin_latitude"
  - "sin_longitude"
  - "cos_julian_day"
  - "cos_local_time"
  - "sin_julian_day"
  - "sin_local_time"
  - "insolation"
  - "lsm"
  - "z"

  diagnostic:
  - "tp"
  - "strd"
  - "ssrd"

  normalizer:
    max:
    - "z"
    std: 
    - "tp"
    none:
    - "cos_latitude"
    - "cos_longitude"
    - "sin_latitude"
    - "sin_longitude"
    - "cos_julian_day"
    - "cos_local_time"
    - "sin_julian_day"
    - "sin_local_time"
    - "insolation"
    - "lsm"
    - "lcc"
    - "mcc"
    - "hcc"
    - "tcc"


hardware:
  paths:
    warm_start: /leonardo_work/DestE_330_25/users/sbuurman/checkpoints/refactor_stage_b/
    data: /leonardo_work/DestE_330_25/anemoi/datasets/
    output: /leonardo_work/DestE_330_25/users/sbuurman/multi-domain-training/output/
    graph: /leonardo_work/DestE_330_25/users/sbuurman/graphs/
  files:
    warm_start: last.ckpt
    dataset: null
    graph: null
  num_gpus_per_node: ${oc.decode:${oc.env:SLURM_GPUS_PER_NODE}}
  num_nodes: ${oc.decode:${oc.env:SLURM_NNODES}}
  num_gpus_per_model: 4

graph:
  overwrite: False
  clobber: False

dataloader:
  batch_size:
    training: 1
    validation: 1
    test: 1
  num_workers:
    training: 1
    validation: 1
    test: 1
    predict: 1
  limit_batches:
    training: null
    validation: null

  training_periods:
    MEPS: # Stretched-grid
      start: 2020-02-05 #oper-ea-an-2016-2023
      end: 2023-05-30 #2022-05-31
    AA: # Stretched-grid
      start: 2022-01-01 #oper-ea-an-2016-2023
      end: 2025-05-31

  validation_periods:
    MEPS:
      start: 2023-05-30
      end: 2023-05-31
    AA:
      start: 2025-06-01
      end: 2025-12-31

  regional_datasets:
    MEPS: 
      dataset: ${hardware.paths.data}/MEPS/aifs-meps-2.5km-2020-2023-6h-v7.zarr
      trim_edge: 50
      drop: ['10fg', '10si', 'cbh', 'fog', 'vis']
    AA:
      dataset: ${hardware.paths.data}/AROME-ARCTIC/arome_arctic-2.5km-2022-2025-6h-v4.zarr
      trim_edge: 50
      drop: ['10fg', '10si', 'cbh', 'fog', 'vis']
  dataset:
