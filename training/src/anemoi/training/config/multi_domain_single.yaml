model:
  keep_batch_sharded: False
  dynamic_mode: True
  num_channels: 1024
  trainable_parameters:
    data: 0
    hidden: 0
    data2hidden: 0
    hidden2data: 0
    hidden2hidden: 0

  bounding:
    - _target_: anemoi.models.layers.bounding.ReluBounding #[0, infinity)
      variables:
      - tp
    - _target_: anemoi.models.layers.bounding.HardtanhBounding #[min_val, max_val]
      variables:
      - tcc
      - hcc
      - mcc
      - lcc
      min_val: 0
      max_val: 1

training:
  run_id: null
  fork_run_id: null 
  transfer_learning: True
  load_weights_only: True
  max_epochs: null
  max_steps: 10000
  lr:
    rate: 6e-06
    min: 3e-7 #3e-7
    warmup: 1000