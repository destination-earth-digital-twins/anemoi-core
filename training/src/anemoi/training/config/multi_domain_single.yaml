      - dataset: null
        trim_edge: null
        drop: null
      - concat:
          - join:
            - dataset: ${hardware.paths.data}/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v8.zarr
            - dataset: ${hardware.paths.data}/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v1-land.zarr 
            start: 1979-01-01
            end: 2023-12-31
