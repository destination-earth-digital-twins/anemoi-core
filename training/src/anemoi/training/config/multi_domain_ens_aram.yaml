defaults:
- data: zarr
- dataloader: multi_domain
- datamodule: ens
- diagnostics: evaluation
- hardware: example
- graph: multi_domain_stretched
- model: graphtransformer_ens_multi_domain
- training: multi_domain_ensemble_stretched
- _self_
#- override hydra/hydra_logging: disabled
#- override hydra/job_logging: disabled
hydra:  
  output_subdir: /pfs/lustrep4/scratch/project_465000527/salihiar/refactor/run-anemoi/lumi #null  
  run:  
    dir: /pfs/lustrep4/scratch/project_465000527/salihiar/refactor/run-anemoi/lumi #.
config_validation: False
diagnostics:
  log:
    mlflow:
      enabled: True
      offline: True
      authentication: True
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: 'metno'
      run_name: debug
      system: True
      max_params_length: 6000
    interval: 10 #100
    wandb:
      entity: null
  plot:
    callbacks: []
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 1
      num_models_saved: -1
data:
  processors:
    normalizer:
      learnable: False
  resolution: None
  forcing:
  - "cos_latitude"
  - "cos_longitude"
  - "sin_latitude"
  - "sin_longitude"
  - "cos_julian_day"
  - "cos_local_time"
  - "sin_julian_day"
  - "sin_local_time"
  - "insolation"
  - "lsm"
  - "z"
  diagnostic:
  - "tp"
  - "ssrd"
  - "strd"
  normalizer:
    max:
    - "z"
    none:
    - "cos_latitude"
    - "cos_longitude"
    - "sin_latitude"
    - "sin_longitude"
    - "cos_julian_day"
    - "cos_local_time"
    - "sin_julian_day"
    - "sin_local_time"
    - "insolation"
    - "lsm"
    - "lcc"
    - "mcc"
    - "hcc"
    - "tcc"
hardware:
  paths:
    output: /leonardo_work/DestE_330_25/users/asalihi0/multi-domain/output/reproduce/
    graph: /leonardo_work/DestE_330_25/users/asalihi0/multi-domain/graphs
    data: /leonardo_work/DestE_330_25/anemoi/datasets
  files:
    dataset: null
    graph: null
  num_gpus_per_node: ${oc.decode:${oc.env:SLURM_GPUS_PER_NODE}}
  num_nodes: ${oc.decode:${oc.env:SLURM_NNODES}}
  num_gpus_per_model: 8
  num_gpus_per_ensemble: 16
graph:
  overwrite: True
  nodes:
    hidden:
      node_builder:
        lam_resolution: 10
        global_resolution: 7
        margin_radius_km: 11
  
dataloader:
  read_group_size: ${hardware.num_gpus_per_model}
  batch_size:
    training: 1
    validation: 1
    test: 1
  num_workers:
    training: 4
    validation: 4
    test: 1
    predict: 1
  limit_batches:
    training: null
    validation: null
  # dataset_weights:
  #   MEPS: 1.0
  #   AA: 0.7 
  training_periods:
    MEPS: 
      start: 2020-02-05
      end: 2024-09-20 
    AA: 
      start: 2022-02-01 
      end: 2024-03-07
    ARA:
      start: 2012-01-01
      end: 2018-12-31
    UWCW_1:
      start: null 
      end: 2022-08-31
    UWCW_2:
      start: null 
      end: 2022-08-31
    UWCW_3:
      start: null 
      end: 2022-08-31
    UWCW_4:
      start: null 
      end: 2022-08-31
  validation_periods:
    MEPS:
      start: 2024-09-21
      end: 2025-09-21
    AA: 
      start: 2024-03-08 
      end: 2025-03-08
    ARA:
      start: 2019-01-01
      end: 2019-12-31
    UWCW_1:
      start: 2022-09-01
      end: 2023-09-30
    UWCW_2:
      start: 2022-09-01
      end: 2023-09-30
    UWCW_3:
      start: 2022-09-01
      end: 2023-09-30
    UWCW_4:
      start: 2022-09-01
      end: 2023-09-30
  regional_datasets:
    MEPS: 
      dataset: ${hardware.paths.data}/MEPS/aifs-meps-2.5km-2020-2025-6h-v7.zarr
      trim_edge: 50
    AA:
      dataset: ${hardware.paths.data}/AROME-ARCTIC/arome_arctic-2.5km-2022-2025-6h-v4.zarr
      trim_edge: 50
    ARA:
      dataset: ${hardware.paths.data}/ARA/geosphere-00-ara-2p5km-2012-2021-3h-v12.zarr
      drop: [ssrd,strd,tp, sdor, slor, sf, cape, 10fg,sf6hr] # drop 600 pres lvl 10fg cape
      rename: {"tp6hr" : "tp", "ssrd6hr": "ssrd", "strd6hr": "strd"}
    UWCW_1:
      - join:
          - dataset: ${hardware.paths.data}/UWC-West/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-knmi.zarr
            rename: {tp_6h: tp, "strd_6h":"strd"}
            trim_edge: [723,1,1,872]
          - dataset: /leonardo_work/DestE_340_25/ai-ml/datasets/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-ssrd-knmi.zarr
            trim_edge: [723,1,1,872]
            select: ["ssrd_6h"]
            rename: {"ssrd_6h":"ssrd"}
    UWCW_2:
      - join:
          - dataset: ${hardware.paths.data}/UWC-West/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-knmi.zarr
            rename: {tp_6h: tp, "strd_6h":"strd"}
            trim_edge: [1,723,872,1]
          - dataset: /leonardo_work/DestE_340_25/ai-ml/datasets/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-ssrd-knmi.zarr
            trim_edge: [1,723,872,1]
            select: ["ssrd_6h"]
            rename: {"ssrd_6h":"ssrd"}
    UWCW_3:
      - join:
          - dataset: ${hardware.paths.data}/UWC-West/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-knmi.zarr
            rename: {tp_6h: tp, "strd_6h":"strd"}
            trim_edge: [723,1,872,1]
          - dataset: /leonardo_work/DestE_340_25/ai-ml/datasets/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-ssrd-knmi.zarr
            trim_edge: [723,1,872,1]
            select: ["ssrd_6h"]
            rename: {"ssrd_6h":"ssrd"}
    UWCW_4:
      - join:
          - dataset: ${hardware.paths.data}/UWC-West/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-knmi.zarr
            rename: {tp_6h: tp, "strd_6h":"strd"}
            trim_edge: [1,723,1,872]
          - dataset: /leonardo_work/DestE_340_25/ai-ml/datasets/uwcwest-rr-an-oper-0001-mars-2p0km-2020-2023-3h-v3-ssrd-knmi.zarr
            trim_edge: [1,723,1,872]
            select: ["ssrd_6h"]
            rename: {"ssrd_6h":"ssrd"}
  # dataset:
  #   cutout:
  #     - dataset: null
  #       #trim_edge: null
  #     - concat:
  #       - join:
  #         - concat:
  #           - join:
  #             - dataset: ${hardware.paths.data}/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2022-6h-v6.zarr
  #               drop: [cp, slor, sdor, tcw, q_50, q_250, q_600, t_50, t_250, t_600, u_50, u_250, u_600, v_50, v_250, v_600, w_50, w_250, w_600, z_50, z_250, z_600]
  #               reorder: sort
  #               start: 1979-01-01 
  #               end: 2022-12-31
  #             - dataset: ${hardware.paths.data}/ERA5/aifs-od-an-oper-0001-mars-n320-2019-2023-6h-v6.zarr
  #               start: 2023-01-01
  #               end: 2023-12-31 
  #               drop: [cp, slor, sdor, tcw, q_50, q_250, q_600, t_50, t_250, t_600, u_50, u_250, u_600, v_50, v_250, v_600, w_50, w_250, w_600, z_50, z_250, z_600]
  #               reorder: sort 
  #         - dataset: ${hardware.paths.data}/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v1-land.zarr
  #           select: [lcc,mcc,hcc,tcc,strd,ssrd]
  #         adjust: ["start", "end"]
  #         reorder: sort
  #       - dataset: ${hardware.paths.data}/IFS/aifs-od-an-oper-0001-mars-n320-2024-2025-6h-v1.zarr
  #       adjust: variables
  #   min_distance_km: 0
  #   adjust: all
  #   reorder: sort
  #   statistics: ${hardware.paths.data}/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2022-6h-v6.zarr
  dataset:
    cutout:
      - dataset: null
      - concat:
          - join:
              - concat:
                  - dataset: /leonardo_work/DestE_330_25/anemoi/datasets/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2022-6h-v6.zarr
                    drop: [cp, slor, sdor, tcw, q_50, q_250, q_600, t_50, t_250, t_600, u_50, u_250, u_600, v_50, v_250, v_600, w_50, w_250, w_600, z_50, z_250, z_600]
                    start: null
                    end: 2022-12-31
                    reorder: sort
                  - dataset: /leonardo_work/DestE_330_25/anemoi/datasets/ERA5/aifs-od-an-oper-0001-mars-n320-2019-2023-6h-v6.zarr
                    start: 2023-01-01
                    end: null
                    drop: [cp, slor, sdor, tcw, q_50, q_250, q_600, t_50, t_250, t_600, u_50, u_250, u_600, v_50, v_250, v_600, w_50, w_250, w_600, z_50, z_250, z_600]
                    reorder: sort
              - dataset: /leonardo_work/DestE_330_25/anemoi/datasets/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v1-land.zarr
                select: [lcc, mcc, hcc, tcc, strd, ssrd]
            reorder: sort
          - dataset: /leonardo_work/DestE_330_25/anemoi/datasets/IFS/aifs-od-an-oper-0001-mars-n320-2024-2025-6h-v1.zarr
            drop: [al, cp, latitude, longitude, q_250, q_50, q_600, sdor, slor, sr, stl1, swvl1, t_250, t_50, t_600, tcw, u_250, u_50, u_600, v_250, v_50, v_600, w_250, w_50, w_600, z_250, z_50, z_600]
            reorder: sort
    min_distance_km: 0
    adjust: all
    reorder: sort
    statistics:
      join:
        - dataset: /leonardo_work/DestE_330_25/anemoi/datasets/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2022-6h-v6.zarr
          drop: [cp, slor, sdor, tcw, q_50, q_250, q_600, t_50, t_250, t_600, u_50, u_250, u_600, v_50, v_250, v_600, w_50, w_250, w_600, z_50, z_250, z_600]
          reorder: sort
        - dataset: /leonardo_work/DestE_330_25/anemoi/datasets/ERA5/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v1-land.zarr
          select: [lcc, mcc, hcc, tcc, strd, ssrd]
      adjust: ["start", "end"]
      reorder: sort
model:
  dynamic_mode: True
  num_channels: 1024
  keep_batch_sharded: False # <-- for CRPS+FFT it is required
  trainable_parameters:
    data: 0
    hidden: 0
    data2hidden: 0
    hidden2data: 0
    hidden2hidden: 0
  bounding:
    - _target_: anemoi.models.layers.bounding.ReluBounding #[0, infinity)
      variables:
      - tp
      - ssrd
      - strd
    - _target_: anemoi.models.layers.bounding.HardtanhBounding #[min_val, max_val]
      variables:
      - tcc
      - hcc
      - mcc
      - lcc
      min_val: 0
      max_val: 1
training:
  precision: bf16-mixed
  run_id: null
  fork_run_id: a9a0dcf197cc49d99ed0e1a4ab698d90 
  transfer_learning: True
  load_weights_only: True
  max_epochs: null
  max_steps: 15000 
  lr:
    rate: 3e-6
    min: 3e-7 #3e-7
    warmup: 1000
  
  ensemble_size_per_device: 1
  training_loss:
    _target_: anemoi.training.losses.CombinedLoss
    losses:
      - _target_: anemoi.training.losses.AlmostFairKernelCRPS 
        alpha: 0.95
        scalers: ['pressure_level', 'general_variable', 'nan_mask_weights', 'node_weights']
      - _target_: anemoi.training.losses.AFCRPSFFTLoss
        alpha: 0.95
        scalers: ['pressure_level', 'general_variable', 'nan_mask_weights']
    scalers: ['*']
    loss_weights: [1.0, 0.1]
  
  per_domain_weight_frac_of_total:
    MEPS: 
      weight_frac_of_total: 0.23
    AA: 
      weight_frac_of_total: 0.2
    ARA:
      weight_frac_of_total: 0.12
    UWCW_1:
      weight_frac_of_total: 0.23
    UWCW_2:
      weight_frac_of_total: 0.23
    UWCW_3:
      weight_frac_of_total: 0.23
    UWCW_4:
      weight_frac_of_total: 0.23